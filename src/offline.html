<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - مواقيت الصلاة</title>

    <!-- Link to the same stylesheet for consistency -->
    <!-- Ensure style.css is cached by the service worker -->
    <link rel="stylesheet" href="/style.css">

    <!-- Basic PWA Meta -->
    <meta name="theme-color" content="#14b8a6"> <!-- Default theme color -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Same Material Symbols URL as index.html, so the service worker serves it from cache while offline -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,-25&icon_names=calendar_month,check_circle,close,dark_mode,error,info,location_on,moon_stars,my_location,nights_stay,partly_cloudy_day,picture_in_picture_alt,progress_activity,sunny,warning,water_lux,wb_twilight,wifi_off&display=block" />

    <!-- Add basic styles directly here ONLY IF style.css might not load -->
    <style>
        /* Basic centering styles as a fallback if style.css fails */
        body.offline-fallback {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            font-family: sans-serif; /* Basic fallback font */
            padding: 20px;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .offline-fallback .material-symbols-rounded {
             font-size: 4rem; margin-bottom: 1rem; color: #94a3b8;
        }
        .offline-fallback h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .offline-fallback p { margin-bottom: 1.5rem; color: #64748b; }
        .offline-fallback button {
            padding: 0.75rem 1.5rem; background-color: #14b8a6; color: white;
            border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem;
        }
         /* Add simple dark mode fallback if needed */
        @media (prefers-color-scheme: dark) {
            body.offline-fallback { background-color: #0f172a; color: #f8fafc; }
            .offline-fallback .material-symbols-rounded { color: #475569; }
            .offline-fallback p { color: #94a3b8; }
            .offline-fallback button { background-color: #0d9488; } /* Slightly darker teal */
        }
    </style>
</head>

<!-- Add fallback class in case CSS doesn't load -->
<body class="offline-fallback">

    <!-- Main container for offline message -->
    <!-- This will inherit styles from style.css if loaded, otherwise use fallback -->
    <main class="offline-container" role="main">
        <span class="material-symbols-rounded offline-icon" aria-hidden="true">
            wifi_off
        </span>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>
            لا يمكن تحميل المحتوى المطلوب حاليًا. يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى.
        </p>
        <button type="button" class="retry-button" onclick="window.location.reload()">
            إعادة المحاولة
        </button>
    </main>

    <!-- Add minimal JS for fallback class removal if needed, but usually not required -->
     <script>
         // Simple check to remove fallback class if styles likely loaded
         // Run this inline to execute immediately
         (function() {
            // Check if a variable defined in style.css exists
            const bodyStyles = window.getComputedStyle(document.body);
            if (bodyStyles.getPropertyValue('--background').trim()) { // Check a root variable
                document.body.classList.remove('offline-fallback');
            }
         })();
     </script>
</body>

</html>
