name: Build and Deploy Prayer Times

on:
  push:
    branches:
      - main # Builds and deploys
  pull_request: # Builds and runs the accuracy check only; the deploy job is skipped

jobs:
  # --- Build Job (Mostly unchanged, ensure artifact upload is correct) ---
  build:
    name: Build and Minify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Fails the build, and so blocks the deploy, if the times drift from the official timetables
      - name: Check prayer times against official timetables
        run: node scripts/check-times.js

      - name: Install Dependencies (at root)
        run: npm ci

      - name: Create Output Directory
        run: mkdir -p dist # Create 'dist' at the root level

      # --- Minification Steps (Keep these as you had them) ---
      - name: Minify HTML files (from src to dist)
        run: |
          # Find the HTML files (index.html) within src
          find ./src -maxdepth 1 -name "*.html" -print | while read file; do
            filename=$(basename "$file") # Get just the filename (e.g., index.html)
            output_file="dist/${filename}"
            npx html-minifier-terser "$file" --collapse-whitespace --remove-comments --remove-optional-tags --remove-redundant-attributes --remove-script-type-attributes --remove-tag-whitespace --use-short-doctype --minify-css true --minify-js true -o "$output_file"
            echo "Minified $file to $output_file"
          done

      - name: Minify CSS files (from src to dist)
        run: |
          # Find style.css within src
          find ./src -maxdepth 1 -name "*.css" -print | while read file; do
            filename=$(basename "$file") # Get style.css
            output_file="dist/${filename}"
            npx csso "$file" -o "$output_file"
            echo "Minified $file to $output_file"
          done

      - name: Minify JavaScript files (from src to dist)
        run: |
          # Find app.js and sw.js within src (exclude adhan.umd.js)
          find ./src -maxdepth 1 -name "*.js" -not -name "adhan.umd.js" -print | while read file; do
            filename=$(basename "$file") # Get app.js or sw.js
            output_file="dist/${filename}"
            npx terser "$file" --compress --mangle -o "$output_file"
            echo "Minified $file to $output_file"
          done
          # Copy adhan.umd.js explicitly
          if [ -f src/adhan.umd.js ]; then
            echo "Copying src/adhan.umd.js to dist/"
            cp src/adhan.umd.js dist/adhan.umd.js
          else
            echo "Warning: src/adhan.umd.js not found."
          fi

      - name: Copy Assets (from src to dist)
        run: |
           echo "Copying manifest, icons, and other assets from src/ to dist/..."
           # Copy manifest
           cp src/manifest.json dist/manifest.json || echo "Warning: src/manifest.json not found."
           # Copy all PNG images
           cp src/*.png dist/ 2>/dev/null || echo "Info: No *.png files found in src/."
           # Copy favicons
           cp src/favicon.ico dist/ 2>/dev/null || echo "Info: No favicon.ico found in src/."
           # Note: favicon-96x96.png and apple-touch-icon.png are covered by *.png
           # Self-hosted fonts and the GeoNames city files; the app needs both, so no fallback
           cp -r src/fonts src/cities dist/

      - name: List dist directory contents (for debugging)
        run: ls -la dist

      # --- Upload Artifact (Crucial for passing files to deploy job) ---
      - name: Upload Minified Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prayer-times-dist # Consistent artifact name
          path: dist/ # Upload the 'dist' directory content
          if-no-files-found: error

  # --- Deploy Job (New Job) ---
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build # IMPORTANT: This job runs only after 'build' succeeds

    # Only pushes to main deploy (pull requests just build and check)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
        contents: read    # Needed for checkout and potentially other steps
        deployments: write  # Crucial: Allows the action to create deployment statuses

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: prayer-times-dist # Must match the upload name
          # No path specified = downloads to the root of the workspace

      - name: List downloaded files (for debugging)
        run: ls -la # Check if files are downloaded correctly

      # Wrangler runs on Node; don't depend on the runner image's default version
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # cloudflare/pages-action was removed from GitHub; Wrangler is Cloudflare's supported way to deploy
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The workspace root holds the downloaded build; branch main is the production deployment
          command: pages deploy . --project-name=prayer-times-pwa --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }} # Associates deployment with commit